_ > nanoagent.plugin.v0001.ProductConfig:
tagline: "One flight request, a real corporate travel policy: book it, refuse it, or hold it for sign-off"
summary: "An agent handles one traveller's flight request under the Blackbaud, Inc. Travel Policy (February 2014), read verbatim. It reads the trip record, searches a simulated flight world (real airports and airlines, synthetic schedules and fares) and submits a decision with the offer, cabin, reason, approver and policy section. A deterministic verifier rebuilds the offers and the policy's answer itself and checks every field. Twenty-four cases cover the 480-minute line on nonstops and on combined connections, a domestic trip longer than any international one, refundable and upgradeable fares, how many executives may share a flight, companions, personal trips and double bookings, and the policy's own gap and contradiction."
highlights:
  - "The verbatim policy: no paraphrase, no rules restated in the task"
  - "Exact boundaries: 480 against 481 scheduled minutes, segments combined, three executives against four"
  - "A gap and a contradiction in the text become holds for approval, each once, with clear twins on both sides"
  - "Fully offline: a hash-seeded flight world with unguessable offer ids"
steps:
  - "Name a case, for example amber-wren, with the traveller's request"
  - "The agent reads the trip record and searches flights on the trip's route and dates"
  - "It submits BOOK, REFUSE or FLAG_FOR_APPROVAL with the offer, cabin, reason, approver and section"
  - "The verifier recomputes the policy's answer and checks every field"
