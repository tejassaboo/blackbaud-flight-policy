_ > nanoagent.plugin.v0001.ManifestConfig:
id: blackbaud-flight-policy
name: Blackbaud Travel Policy Flight Booking
version: 0.1.0
status: in-development
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: []

# One entry per contract.Tool; its input and output classes are contract.TOOLS's.
tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  booking_requirements:
    description: Show the trip record's fields with their meanings, the conventions of the simulated flight world (local times, dates, fares, sold-out seats) and the airports it knows
  get_trip:
    description: Read a booking request's trip record, by case id - who flies, where and when, why, what they ask for, sign-offs on file, colleagues' flights, tickets already held and fare rules
  search_flights:
    description: List every offer on a route that leaves on one local date, one way or as a round trip with a return date - airline, cabin, fare in cents, whether seats are left and the fare is refundable, each flight's local and UTC times and scheduled minutes, layovers (simulated schedules and fares)
  solve_booking:
    description: The answer key, never given to the agent - the decision the company's handbook requires for a booking request, with every accepted offer, cabin, reason, approver and section

# One entry per contract.Task; its input and output classes are contract.TASKS's.
tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  booking-requirements:
    description: Show the trip record's fields, the flight world's conventions and its airports
    runner: tool
    tools: [booking_requirements]
    reference: null
    instructions: Call booking_requirements with topic ALL (FIELDS for only the fields and conventions, AIRPORTS for only the airport list) and show what it returns.
  search-flights:
    description: Show the flight offers on a route and local date for a booking request's case, one way or round trip
    runner: tool
    tools: [search_flights]
    reference: null
    instructions: Call search_flights with the case id, the airport codes to leave from and fly to, the local date to leave and, for a round trip, the return date, and show the offers it returns.
  book-blackbaud-flight:
    description: Handle one traveller's flight booking request for a software company
    runner: agent
    tools: [get_trip, search_flights]
    reference: solve_booking
    instructions: |-
      Handle the traveller's flight booking request in the task input, as the travel handbook of the company allows.

      Call get_trip with the task input's case id to read the trip record, then call search_flights for the trip's origin, destination and travel date, with its return date when the trip record gives one. Then call submit with your single decision:
      - BOOK when the company buys a ticket now, with the offer_id of the offer to buy and its cabin;
      - REFUSE when the company buys no ticket at all for this trip, with an empty offer_id and cabin NONE;
      - FLAG_FOR_APPROVAL when the ticket must wait, either for someone's sign-off or because the handbook's words leave the answer open, with the offer_id of the offer to hold and its cabin.
      Give a reason_code, the approver role and the handbook section (clause) from their closed lists; use NONE where nothing applies.
